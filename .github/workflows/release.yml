name: Release archives

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

run-name: Release ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release archives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate package
        run: python3 .github/scripts/validate_package.py
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("Packages/com.supabaseunity.client/package.json").read_text())
          expected = f"v{manifest['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Tag {actual} does not match package version {expected}")
          PY
      - name: Build release archives
        run: python3 .github/scripts/build_release.py --output dist
      - name: Match archives to local Unity verification
        run: python3 .github/scripts/validate_package.py --release-archives dist
      - name: Build release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/build_release_notes.py \
            --version "${RELEASE_TAG#v}" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* .github/release-verification.json \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "Supabase for Unity $RELEASE_TAG" \
            "${prerelease[@]}"
