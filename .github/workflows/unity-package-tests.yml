name: Unity package tests (licensed)

# Requires the UNITY_LICENSE secret. That secret is NOT currently set, so the
# matrix below skips instead of failing. If a license ever becomes available,
# adding the secret activates this workflow with no further changes.
#
# Until then, no C# is compiled in CI. The EditMode suite must be run locally
# before merging. See CONTRIBUTING.md.
#
# Secrets are also withheld from pull requests opened from forks, so the matrix
# skips for those regardless.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

run-name: Licensed Unity matrix (${{ github.ref_name }})

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    name: License available?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE is not set. Skipping the Unity matrix; C# is not compiled in CI."
          fi

  editmode:
    name: Unity ${{ matrix.unity }}
    needs: license
    if: >-
      needs.license.outputs.available == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        unity:
          - 2021.3.45f2
          - 2022.3.62f2
          - 6000.4.8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run package tests
        id: tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          packageMode: true
          projectPath: Packages/com.supabaseunity.client
          unityVersion: ${{ matrix.unity }}
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.unity }} package tests
      - name: Upload test results
        if: always() && steps.tests.outputs.artifactsPath != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.unity }}
          path: ${{ steps.tests.outputs.artifactsPath }}
